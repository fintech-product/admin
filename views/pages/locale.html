<form id="localeForm" name="localeForm" class="form" novalidate aria-readonly="{{readonly}}">
  <header>
    <button type="button" id="backBtn" name="backBtn" class="btn-back" onclick="goBack()"></button>
    <h2>{{resource.locale}}</h2>
  </header>
  <div class="row">
    <label class="col s12 m6">
      {{resource.locale_code}}
      <input
        type="text"
        id="code"
        name="code"
        value="{{locale.code}}"
      {% if editMode %}
        readonly
      {% endif %}
        maxlength="11"
        required
        onblur="requiredOnBlur(event)"
        placeholder="{{resource.locale_code}}"
      />
    </label>
    <label class="col s12 m6">
      {{resource.locale_name}}
      <input
        type="text"
        id="name"
        name="name"
        value="{{locale.name}}"
        maxlength="100"
        required
        onblur="requiredOnBlur(event)"
        placeholder="{{resource.locale_name}}"
      />
    </label>
    <label class="col s12 m6">
      {{resource.locale_native_name}}
      <input
        type="text"
        id="nativeName"
        name="nativeName"
        value="{{locale.nativeName}}"
        maxlength="100"
        required
        onblur="requiredOnBlur(event)"
        placeholder="{{resource.locale_native_name}}"
      />
    </label>
    <label class="col s12 m6">
      {{resource.country_code}}
      <input
        type="text"
        id="countryCode"
        name="countryCode"
        value="{{locale.countryCode}}"
        maxlength="2"
        required
        onblur="requiredOnBlur(event)"
        placeholder="{{resource.country_code}}"
      />
    </label>
    <label class="col s12 m6">
      {{resource.country_name}}
      <input
        type="text"
        id="countryName"
        name="countryName"
        value="{{locale.countryName}}"
        maxlength="100"
        required
        onblur="requiredOnBlur(event)"
        placeholder="{{resource.country_name}}"
      />
    </label>
    <label class="col s12 m6">
      {{resource.country_native_name}}
      <input
        type="text"
        id="nativeCountryName"
        name="nativeCountryName"
        value="{{locale.nativeCountryName}}"
        maxlength="100"
        required
        onblur="requiredOnBlur(event)"
        placeholder="{{resource.country_native_name}}"
      />
    </label>
    <label class="col s12 m6">
      {{resource.first_day_of_week}}
      <input
        type="tel"
        id="firstDayOfWeek"
        name="firstDayOfWeek"
        class="text-right"
        value="{{locale.firstDayOfWeek}}"
        maxlength="1"
        required
        onkeypress="return integerOnKeyPress(event)"
        onfocus="numberOnFocus(event)"
        onblur="numberOnBlur(event)"
        placeholder="{{resource.first_day_of_week}}"
      />
    </label>
    <label class="col s12 m6">
      {{resource.date_format}}
      <input
        type="text"
        id="dateFormat"
        name="dateFormat"
        value="{{locale.dateFormat}}"
        maxlength="13"
        required
        onblur="requiredOnBlur(event)"
        placeholder="{{resource.date_format}}"
      />
    </label>
    <label class="col s12 m6">
      {{resource.decimal_separator}}
      <input
        type="text"
        id="decimalSeparator"
        name="decimalSeparator"
        value="{{locale.decimalSeparator}}"
        maxlength="1"
        required
        onblur="requiredOnBlur(event)"
        placeholder="{{resource.decimal_separator}}"
      />
    </label>
    <label class="col s12 m6">
      {{resource.group_separator}}
      <input
        type="text"
        id="groupSeparator"
        name="groupSeparator"
        value="{{locale.groupSeparator}}"
        maxlength="1"
        required
        onblur="requiredOnBlur(event)"
        placeholder="{{resource.group_separator}}"
      />
    </label>
    <label class="col s12 m6">
      {{resource.currency_code}}
      <input
        type="text"
        id="currencyCode"
        name="currencyCode"
        value="{{locale.currencyCode}}"
        maxlength="3"
        required
        onblur="requiredOnBlur(event)"
        placeholder="{{resource.currency_code}}"
      />
    </label>
    <label class="col s12 m6">
      {{resource.currency_symbol}}
      <input
        type="text"
        id="currencySymbol"
        name="currencySymbol"
        value="{{locale.currencySymbol}}"
        maxlength="4"
        required
        onblur="requiredOnBlur(event)"
        placeholder="{{resource.currency_symbol}}"
      />
    </label>
    <label class="col s12 m6">
      {{resource.currency_decimal_digits}}
      <input
        type="tel"
        id="currencyDecimalDigits"
        name="currencyDecimalDigits"
        class="text-right"
        value="{{locale.currencyDecimalDigits}}"
        maxlength="1"
        required
        onkeypress="return integerOnKeyPress(event)"
        onfocus="numberOnFocus(event)"
        onblur="numberOnBlur(event)"
        placeholder="{{resource.currency_decimal_digits}}"
      />
    </label>
    <label class="col s12 m6">
      {{resource.currency_pattern}}
      <input
        type="tel"
        id="currencyPattern"
        name="currencyPattern"
        class="text-right"
        value="{{locale.currencyPattern}}"
        maxlength="1"
        min="0"
        max="3"
        required
        onkeypress="return integerOnKeyPress(event)"
        onfocus="numberOnFocus(event)"
        onblur="numberOnBlur(event)"
        placeholder="{{resource.currency_pattern}}"
      />
    </label>
    <label class="col s12 m6">
      {{resource.currency_sample}}
      <input
        type="text"
        id="currencySample"
        name="currencySample"
        value="{{locale.currencySample}}"
        maxlength="16"
        required
        onblur="requiredOnBlur(event)"
        placeholder="{{resource.currency_sample}}"
      />
    </label>
    <div class="col s12 m6 radio-section">
      {{resource.status}}
      <div class="radio-group">
        <label><input type="radio" id="active" name="status" value="A" {{isChecked('A', locale.status)}}/>{{resource.active}}</label>
        <label><input type="radio" id="inactive" name="status" value="I" {{isChecked('I', locale.status)}}/>{{resource.inactive}}</label>
      </div>
    </div>
  </div>
  <footer>
    <button type="submit" id="saveBtn" name="saveBtn" onclick="submitForm(event)" {% if readonly %} disabled {% endif %}>{{resource.save}}</button>
  </footer>
</form>
